name: Bauen und testen

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GnuCOBOL installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
          cobc --version | head -1
      - name: Bauen
        run: make
      - name: Logik-Tests
        run: make test
